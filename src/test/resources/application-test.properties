# Aviso: Algumas das configurações não foram revisadas após a publicação do trabalho, então podem estar desatualizadas

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:adsforms;MODE=MariaDB;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# DevServices
quarkus.datasource.devservices.enabled=false

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=drop-and-create