<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulário de Cadastro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
          <div class="card p-4 shadow-sm border-0">
            <div class="card-body">
              <h1 class="mb-4 text-center">
                <i class="bi bi-journal-text me-2"></i>
                Formulário de cadastro
              </h1>
              <p class="text-muted mb-4">
                Preencha os dados abaixo pra gente conhecer você melhor
              </p>
              <form action="#" method="post" novalidate>
                <div class="mb-3">
                  <label for="nomeCompleto" class="form-label"
                    ><i class="bi bi-person-vcard me-1"> </i>Nome
                    completo</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="nomeCompleto"
                    name="nomeCompleto"
                    placeholder="Digite seu nome completo"
                    required
                  />
                  <div class="form-text">Esse campo é importante</div>
                </div>

                <div class="mb-3">
                  <label for="endereco" class="form-label"
                    ><i class="bi bi-geo-alt me-1"></i>Endereço</label
                  >
                  <input
                    type="text"
                    class="form-control is-valid"
                    id="endereco"
                    name="endereco"
                    placeholder="Digite seu endereço completo"
                  />
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-8">
                    <label for="rua" class="form-label"
                      ><i class="bi bi-signpost-split me-1"></i>Rua</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="rua"
                      name="rua"
                      placeholder="Informe a rua"
                    />
                  </div>
                  <div class="col-md-4">
                    <label for="numero" class="form-label"
                      ><i class="bi bi-hash me-1"></i>Número</label
                    >
                    <input
                      type="text"
                      class="form-control is-invalid"
                      id="numero"
                      name="numero"
                      placeholder="Nº da casa ou apto"
                    />
                    <div class="invalid-feedback">
                      Confere se o número tá correto
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="dataNascimento" class="form-label"
                    ><i class="bi bi-calendar-heart me-1"></i>Data de
                    nascimento</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="dataNascimento"
                    name="dataNascimento"
                  />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label"
                    ><i class="bi bi-envelope-at me-1"></i>E-mail</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="exemplo@dominio.com"
                  />
                  <div class="form-text">
                    Não esquece de olhar se digitou o "@"
                  </div>
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-sm-6">
                    <label for="cidade" class="form-label"
                      ><i class="bi bi-building me-1"></i>Cidade</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="cidade"
                      name="cidade"
                      placeholder="Onde tu mora"
                    />
                  </div>
                  <div class="col-sm-6">
                    <label for="estado" class="form-label"
                      ><i class="bi bi-flag me-1"></i>Estado</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="estado"
                      name="estado"
                      placeholder="UF"
                    />
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="aceite"
                    checked
                  />
                  <label class="form-check-label" for="aceite">
                    <i class="bi bi-patch-check me-1"></i>Confirmo que eu sou
                    quem estou informando ser
                  </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">
                  <i class="bi bi-send-plus me-1"></i>Cadastrar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- O motivo de eu ter colocado isso foi apenas para testar algumas interações de entrada e submit nos formulários -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        if (form) {
          form.addEventListener("submit", function (event) {
            event.preventDefault();
          });
        }
      });
    </script>
  </body>
</html>
